<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Alert_type.css">
</head>
<body>
    <div class="alertPage">
        <input type="checkbox" name="hide" id="hide" class="hide">
        <label for="hide">&equiv;</label>
        <div class="alertCard1">
            <div class="alertTitle">
                Settings Saved
            </div>
            <div class="alertInfo">
                Your assigned settings have been saved!
                It will persist on next load. 
                Click cancel to restore defaults.
            </div>
            <div class="alertActionBtns">
                <!-- dynamically generated as per type of alert -->
                 <button class="button" id="cancelBtn">Cancel</button>
                 <button class="button doneBtn" id="doneBtn">Done</button>
            </div>
            <div class="invi"></div>
        </div>

        <!-- type 2 -->
         <div class="alertCard2 hidden">
            <div id="closeIcon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
            <div class="alertMsg">
                Your settings are saved!
            </div>
            <div class="alertInfo2">
                Your assinged settings has been saved and will persist when next the page loads, click cancel to restore defaults.
            </div>
            <div class="alertActionBtns2">
                <button class="button2 confirm">Confirm</button>
                <button class="button2 cancel">Cancel</button>
            </div>
         </div>
    </div>
    <script src="./Alert_type.js"></script>
</body>
</html>
