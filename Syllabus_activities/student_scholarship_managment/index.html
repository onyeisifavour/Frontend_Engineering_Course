
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="./Codepong_26.css">
</head>
<body>
  <a href="#main" class="skip-link">
    Skip to main content
  </a>
  <div class="dashboard-container">
    <header class="header">

      <div class="header-searchbar">
        <input type="text" placeholder="Search..." id="search-bar" class="search-bar__input">
        <label for="search-bar" class="search-bar__icon"></label>
      </div>

      <div class="readiness-score">
        <div class="user-readiness-info">
          <div class="readiness-info__bar--contnr">
              <div class="readiness-info__bar">
                  <div>
                      <span class="percent">62%</span>
                  </div>   
              </div>
          </div>
          <div class="readiness-info__term--contnr">
              <div class="readiness-info__term">Favour's Readiness</div>
          </div>
        </div>
      </div>

    </header>

    <aside class="sidebar">
      <input type="checkbox" class="sb-toggle" id="sb-toggle" checked></input>
      <label for="sb-toggle" class="sb-toggle__label">
        <svg
          class="sb-toggle__svg" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          class="sb-toggle__svg"
        >
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
      </label>
      <div class="sidebar__icons">

        <div class="hambgr-menu"></div>
        <div class="menu-icons__contnr">
          <i>
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="30" fill="#3182CE" />
            </svg>
          </i>
          <i>
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="30" fill="#3182CE" />
            </svg>
          </i>
          <i>
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="30" fill="#3182CE" />
            </svg>          
          </i>
          <i>
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="30" fill="#3182CE" />
            </svg>
          </i>
        </div>
        
      </div>

      <div class="sidebar__text">
        <span class="icon-label">
          <a href="http://maths" target="_blank" rel="noopener noreferrer" class="math_link">
            Maths
          </a>
        </span>
        <span class="icon-label">
          <a href="http://physics" target="_blank" rel="noopener noreferrer" class="physics_link">
            Physics
          </a>
        </span>
        <span class="icon-label">
          <a href="http://chemistry" target="_blank" rel="noopener noreferrer" class="chemistry_link">
            Chemistry
          </a>
        </span>
        <span class="icon-label">
          <a href="http://biology" target="_blank" rel="noopener noreferrer" class="biology_link">
            Biology
          </a>
        </span>
      </div>

    </aside>

    <main id="main" class="main-content">

      <div class="main-content__card card1">
        <div class="progress__contnr">
          <div class="progress__bar"></div>
        </div>
        <p>Favour's Progress</p>
      </div>

      <div class="main-content__card card2">
        <p class="learning-streak__term">Learning Streak</p>
        <div class="learning-streak__streak">
          <div class="streak"></div>
          <div class="streak"></div>
          <div class="streak"></div>
          <div class="streak"></div>
          <div class="streak"></div>
          <div class="streak"></div>
          <div class="streak"></div>
        </div>
      </div>
      <div class="main-content__card card3">
        <p class="objective">Time remaining till
          <span class="objective__date">April 2027 </span>
        </p>
        <div class="countdown">
          <div class="countdown__card">
            <span>Year(s)</span>
            0
          </div>
          <div class="countdown__card">
            <span>Month(s)</span>
            0
          </div>
          <div class="countdown__card">
            <span>Day(s)</span>
            0
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
